site_name: Live
site_description: Live — компьютерная игра по мотивам русской рулетки
site_url: https://caseyjohnson-rs.github.io/Live/
copyright: © 2026 Casey Johnson. Все права защищены.

# Битый якорь (например, в глоссарии) должен ронять сборку в --strict
validation:
  anchors: warn

theme:
  name: material
  language: ru
  font:
    text: Exo 2
    code: IBM Plex Mono
  logo: logo.svg
  favicon: favicon.svg
  # Только тёмная схема: палитра «Бутылочное стекло» — в stylesheets/palette.css
  # custom — чтобы встроенные цвета Material не перебивали наши роли
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

extra:
  # Без строки «Made with Material for MkDocs» в подвале
  generator: false
  # Контакты — иконками в подвале, рядом с копирайтом
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CaseyJohnson-RS
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/casey_johnson
      name: Telegram
    - icon: fontawesome/solid/envelope
      link: mailto:casey.johnson.r@yandex.ru
      name: casey.johnson.r@yandex.ru

# Порядок важен: при равной специфичности побеждает то, что подключено позже
extra_css:
  - stylesheets/palette.css
  - stylesheets/base.css
  - stylesheets/cards.css
  - stylesheets/home.css
  - stylesheets/blog.css
  - stylesheets/rules.css

plugins:
  - search:
      lang: ru

markdown_extensions:
  - toc:
      permalink: true
      # Стандартный slugify выбрасывает кириллицу — якоря вида #выстрел ломаются
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      # свои иконки: overrides/.icons/live/*.svg → :live-имя:
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Главная: index.md
  - Блог: blog/index.md
  - Об игре:
      - about/index.md
      - Правила:
          - about/rules/index.md
          - about/rules/table.md
          - about/rules/shot.md
          - about/rules/spread.md
          - about/rules/chips.md
          - about/rules/hand.md
          - about/rules/round.md
          - about/rules/cheatsheet.md
      - about/items/index.md
      - Глоссарий: about/glossary.md
